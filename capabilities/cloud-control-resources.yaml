    baseUri: https://cloudcontrolapi.{region}.amazonaws.com
    description: AWS Cloud Control API — Resources business capability. Self-contained, no shared references.
    resources:
    - name: ?Action=CreateResource
      path: /?Action=CreateResource
      operations:
      - name: createresource
        method: POST
        description: Create a New Cloud Resource
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: ?Action=DeleteResource
      path: /?Action=DeleteResource
      operations:
      - name: deleteresource
        method: POST
        description: Delete a Cloud Resource
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: ?Action=GetResource
      path: /?Action=GetResource
      operations:
      - name: getresource
        method: POST
        description: Read a Cloud Resource
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
