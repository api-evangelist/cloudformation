    - name: ?Action=ListResources
      path: /?Action=ListResources
      operations:
      - name: listresources
        method: POST
        description: List Resources of a Specified Type
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
